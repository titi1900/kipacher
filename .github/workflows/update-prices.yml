name: Update KIPACHER prices

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    name: Générer latest.json puis commit
    runs-on: ubuntu-latest
    timeout-minutes: 180

    concurrency:
      group: update-prices-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          else
            pip install requests
          fi

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run price update script
        run: python scripts/update_prices.py
        env:
          PYTHONUNBUFFERED: "1"
          # all = tous les centres du maillage France
          CENTERS: "all"
          RADIUS_KM: "10"
          MAX_STORES_PER_CENTER: "12"
          MAX_STORES_TO_PRICE: "60"
          MAX_PRODUCTS: "30"
          # SKIP_OFF: "1"

      - name: Check generated file
        run: |
          test -f data/latest.json
          python -c "import json;d=json.load(open('data/latest.json'));m=d.get('meta') or {};print('stores',len(d.get('stores',[])));print('products',len(d.get('products',{})));print('centers_count',m.get('centers_count'));print('ean_count',m.get('ean_count'))"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "chore(data): update prices France – $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main